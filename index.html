<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1a4a6a" />
<title>TARAJAL</title>
<meta name="description" content="Defend Tarajal beach. Stop the boats. Hold the city." />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="/site.webmanifest" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div id="hudTop">
      <div id="vitals">
        <div id="hp" aria-label="health"></div>
        <div id="stamina" role="meter" aria-label="stamina" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
          <div id="staminaFill"></div>
        </div>
        <div id="heldWrap"><span id="heldLabel">HOLDING</span><span id="held">RIFLE</span></div>
      </div>
      <div id="meta">
        <div id="waveWrap"><span id="waveLabel">WAVE</span><span id="wave">1</span></div>
        <div id="ammoWrap"><span id="ammoLabel">AMMO</span><span id="ammo">24</span></div>
        <div id="breachedWrap"><span id="breachedLabel">THROUGH</span><span id="breached">0/12</span></div>
        <div id="enemiesWrap"><span id="enemiesLabel">INBOUND</span><span id="enemies">0</span></div>
        <div id="scoreWrap"><span id="scoreLabel">SCORE</span><span id="score">0</span></div>
      </div>
    </div>
    <div id="prompt" aria-live="polite"><kbd>E</kbd> grab</div>
    <div id="hints">
      <kbd>WASD</kbd> move
      <kbd>SHIFT</kbd> run
      <kbd>CLICK</kbd> punch
      <kbd>R-CLICK</kbd> shoot
      <kbd>E</kbd> grab rock
      <kbd>ESC</kbd> pause
    </div>
  </div>

  <div id="overlay" class="on">
    <div class="panel">
      <h1 id="title">TARAJAL</h1>
      <p id="subtitle">Boats on the water. The city behind you. Fight with your fists — ammo is scarce.</p>
      <p id="finalScore" class="hidden"></p>
      <div id="menuActions">
        <button id="startBtn" type="button">DEFEND</button>
        <button id="resumeBtn" class="hidden" type="button">RESUME</button>
        <button id="restartBtn" class="hidden" type="button">RESTART</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
